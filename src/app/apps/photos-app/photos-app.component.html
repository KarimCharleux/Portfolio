<div class="photos">
  <div class="photos__masonry" [inert]="!!selectedPhoto()">
    @for (column of columns; track $index) {
      <div class="photos__column" (focusin)="onColumnFocusIn($event)">
        <div
          class="photos__column-track"
          [class.photos__column-track--reverse]="column.reverse"
          [style.animation-duration.s]="column.durationS"
        >
          @for (photo of column.photos; track photo.id) {
            <button type="button" class="photos__tile" (click)="open(photo)">
              <img
                loading="lazy"
                decoding="async"
                [src]="photo.gridSrc"
                [alt]="altFor(photo)"
                [width]="photo.width"
                [height]="photo.height"
              />
            </button>
          }
          @for (photo of column.photos; track photo.id) {
            <button
              type="button"
              class="photos__tile"
              aria-hidden="true"
              tabindex="-1"
              (click)="open(photo)"
            >
              <img
                alt=""
                loading="lazy"
                decoding="async"
                [src]="photo.gridSrc"
                [width]="photo.width"
                [height]="photo.height"
              />
            </button>
          }
        </div>
      </div>
    }
  </div>

  @if (selectedPhoto(); as photo) {
    <div class="photos__lightbox">
      <div class="photos__lightbox-backdrop" role="presentation" (click)="close()"></div>
      <div
        class="photos__lightbox-dialog"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="altFor(photo)"
      >
        <button
          #closeBtn
          type="button"
          class="photos__lightbox-close"
          [attr.aria-label]="i18n.t('photosClose')"
          (click)="close()"
        >
          ✕
        </button>
        <img class="photos__lightbox-img" [src]="photo.fullSrc" [alt]="altFor(photo)" />
      </div>
    </div>
  }
</div>
