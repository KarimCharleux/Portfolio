<nav class="dock" (pointermove)="onDockPointerMove($event)" (pointerleave)="onDockLeave()">
  @for (app of apps; track app.id) {
    <div class="dock__slot">
      @if (hoveredApp() === app.id) {
        <div class="dock__tooltip">{{ app.tooltip }}</div>
      }
      <button
        #dockIcon
        type="button"
        class="dock__icon"
        [attr.data-app-id]="app.id"
        [style.transform]="'scale(' + scaleFor(app.id) + ')'"
        [attr.aria-label]="app.label"
        (pointerenter)="onIconPointerEnter(app.id)"
        (pointerleave)="onIconPointerLeave()"
        (click)="open(app)"
      >
        <app-icon [icon]="app.icon" />
        @if (isOpen(app.id)) {
          <span class="dock__indicator"></span>
        }
      </button>
    </div>
  }
</nav>
