<header class="topbar">
  <div class="topbar__left">
    <button
      type="button"
      class="topbar__apple-button"
      [attr.aria-label]="i18n.t('aboutPortfolio')"
      (click)="openAbout()"
    >
      <span class="topbar__glyph topbar__glyph--apple" [style.--glyph]="appleGlyph"></span>
    </button>
    <span class="topbar__app-name">{{ activeAppName() }}</span>
  </div>

  <div #notch class="topbar__notch"></div>

  <div class="topbar__right">
    <button
      type="button"
      class="topbar__lang-toggle"
      [attr.aria-label]="`${i18n.lang() === 'fr' ? 'FR' : 'EN'} — ${i18n.t('langToggleLabel')}`"
      (click)="toggleLang()"
    >
      {{ i18n.lang() === 'fr' ? 'FR' : 'EN' }}
    </button>
    <button
      type="button"
      class="topbar__item"
      [attr.aria-label]="i18n.t('toggleDarkMode')"
      (click)="toggleTheme()"
    >
      <span class="topbar__glyph topbar__glyph--theme" [style.--glyph]="themeGlyph()"></span>
    </button>
    <button
      type="button"
      class="topbar__item"
      [class.topbar__item--off]="!soundOn()"
      [attr.aria-label]="i18n.t('menuBarSound')"
      [attr.aria-pressed]="soundOn()"
      (click)="toggleSound()"
    >
      <span class="topbar__glyph topbar__glyph--sound" [style.--glyph]="soundGlyph()"></span>
    </button>
    <button
      type="button"
      class="topbar__item"
      [class.topbar__item--off]="!bluetoothOn()"
      [attr.aria-label]="i18n.t('menuBarBluetooth')"
      [attr.aria-pressed]="bluetoothOn()"
      (click)="toggleBluetooth()"
    >
      <span
        class="topbar__glyph topbar__glyph--bluetooth"
        [style.--glyph]="bluetoothGlyph()"
      ></span>
    </button>
    <span
      class="topbar__item topbar__item--static"
      role="img"
      [attr.aria-label]="i18n.t('menuBarBattery')"
    >
      <span class="topbar__glyph topbar__glyph--battery" [style.--glyph]="batteryGlyph"></span>
    </span>
    <button
      type="button"
      class="topbar__item"
      [class.topbar__item--off]="!wifiOn()"
      [attr.aria-label]="i18n.t('menuBarWifi')"
      [attr.aria-pressed]="wifiOn()"
      (click)="toggleWifi()"
    >
      <span class="topbar__glyph topbar__glyph--wifi" [style.--glyph]="wifiGlyph()"></span>
    </button>
    <span class="topbar__clock">{{ formattedTime() }}</span>
  </div>
</header>
